<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ヤフオク入札予約</title>
<style>
  body { width: 380px; margin: 0; font: 13px/1.5 "Meiryo", "Yu Gothic UI", sans-serif; color: #222; background: #fff; }
  header { background: #e8590c; color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 14px; }
  header button { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 5px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  #list { padding: 8px; display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; }
  .empty { color: #777; padding: 16px 8px; text-align: center; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; }
  .title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title a { color: #1c7ed6; text-decoration: none; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 6px; }
  .st { font-size: 12px; padding: 1px 8px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .待機中, .準備中, .入札中 { background: #1c7ed6; }
  .完了 { background: #2f9e44; } .練習完了 { background: #7048e8; } .失敗 { background: #e03131; } .取消 { background: #868e96; }
  .left { font-size: 12px; color: #555; }
  .btn { border: 1px solid #ccc; background: #f8f9fa; border-radius: 5px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  details { margin-top: 4px; font-size: 11px; color: #555; }
  details pre { white-space: pre-wrap; margin: 4px 0 0; font: inherit; }
  .dry { font-size: 11px; color: #7048e8; }
</style>
</head>
<body>
<header><b>入札予約の一覧</b><button id="clear">終わったものを消す</button></header>
<div id="list"></div>
<script src="popup.js"></script>
</body>
</html>
